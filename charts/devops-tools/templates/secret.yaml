{{- $creds := include "devops-tools.credentials" . | fromJson -}}
{{- $login := .Values.config.auth.bootstrapAdmins.passwordLogin -}}
{{- if $login.password }}
{{- if lt (len $login.password) 8 }}
{{- fail "auth.bootstrapAdmins.passwordLogin.password is shorter than 8 characters. A portal that can read secrets and restart workloads should not be reachable with four." }}
{{- end }}
{{- if $login.passwordHash }}
{{- fail "auth.bootstrapAdmins.passwordLogin has both password and passwordHash. Supply one or the other: the plain password, or a bcrypt hash of it." }}
{{- end }}
{{- end }}
{{- if and (hasKey $creds "bootstrapPassword") (not $login.username) }}
{{- fail "a break-glass password is configured but auth.bootstrapAdmins.passwordLogin.username is empty, so nothing would accept it — the password form only appears for a named account. Set username to the account listed in bootstrapAdmins.users." }}
{{- end }}
{{- /*
Only what was written in values goes in here. A credential supplied as a Secret
of somebody's own is referenced where it already stands — copying it would make
a second thing to rotate, and a stale copy is indistinguishable from a working
one until the day it is not.
*/ -}}
{{- $inline := dict -}}
{{- range $id, $cred := $creds -}}
{{- if $cred.inline -}}
{{- $_ := set $inline $id $cred.inline -}}
{{- end -}}
{{- end -}}
{{- with (get $inline "ldapCaCert") }}
{{- if not (contains "BEGIN CERTIFICATE" .) }}
{{- fail "auth.ldap.tls.caCert does not look like PEM — it should start with -----BEGIN CERTIFICATE-----. A file in another format is refused at startup, but a value pasted without its header would only fail at the first sign-in." }}
{{- end }}
{{- end }}
{{- $ownSessionKey := not .Values.session.existingSecret }}
{{- if or $ownSessionKey $inline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-tools.fullname" . }}
  labels: {{- include "devops-tools.labels" . | nindent 4 }}
  annotations:
    # Keep the key when the release is removed and reinstalled, otherwise the
    # sessions of everyone signed in are invalidated.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if $ownSessionKey }}
  sessionKey: {{ include "devops-tools.sessionKey" . | quote }}
  {{- end }}
  {{- /*
  Written in values beside the setting each belongs to, and moved here so none
  of them travels in the ConfigMap. See templates/configmap.yaml.
  */}}
  {{- range $key, $value := $inline }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
