name: Release

# A tag is the release. v0.25.2 publishes the image as 0.25.2 and the chart at
# whatever version Chart.yaml carries — the two move independently on purpose,
# so the tag is checked against appVersion rather than assumed to match.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the GitHub release

env:
  IMAGE: 1kcsd/devops-tools
  CHART_REGISTRY: oci://registry-1.docker.io/1kcsd

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the versions the chart declares
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(sed -n 's/^appVersion:[[:space:]]*"\?\([^"]*\)"\?[[:space:]]*$/\1/p' charts/devops-tools/Chart.yaml)
          chart=$(sed -n 's/^version:[[:space:]]*\(.*\)[[:space:]]*$/\1/p' charts/devops-tools/Chart.yaml)

          if [ "$tag" != "$app" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, Chart.yaml appVersion says $app."
            echo "The image tag comes from appVersion, so releasing this would publish"
            echo "a version nobody asked for. Bump one of the two and tag again."
            exit 1
          fi

          echo "app=$app"     >> "$GITHUB_OUTPUT"
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "image $IMAGE:$app, chart $chart"

      # Everything is verified before anything is published: a half-done release
      # is worse than a late one.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./... && go test ./...

      # Sonatype Lifecycle reads Go dependencies most accurately from a go.list:
      # the modules the build compiles, where go.sum also lists every version
      # the module graph merely mentions — three times as many here, most of
      # them years old and never downloaded. Sonatype's own command, run on the
      # tagged source, and attached to the release below, so a deployment
      # pipeline can evaluate exactly the version it is about to deploy.
      # https://help.sonatype.com/en/go-application-analysis.html
      - name: List the modules the binary is built from
        run: |
          go list -f '{{define "M"}}{{.Path}} {{.Version}}{{end}}{{with .Module}}
          {{if not .Main}}{{if .Replace}}{{template "M" .Replace}}
          {{else}}{{template "M" .}}{{end}}{{end}}{{end}}' -compiled -deps ./... \
            | sort -u | sed '/^$/d' > go.list
          echo "$(wc -l < go.list) modules"
          test -s go.list

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # VERSION is stamped into the binary: a running instance reports it in
          # the sidebar and in its startup log, and an image built without it
          # calls itself `dev`.
          build-args: VERSION=${{ steps.v.outputs.app }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.app }}
          # An SBOM lets a scanner read what is in the image instead of
          # inferring it, and provenance records how it was built. Both are
          # attestations, which is also why the VEX statements further down are
          # attached rather than copied in: Scout ignores VEX files on the
          # filesystem of an image that carries any attestation.
          sbom: true
          provenance: mode=max

      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        run: |
          # The module list goes inside the chart as well as onto the release.
          # A deployment pipeline already pulls the chart from the registry,
          # so it can read the list from there without reaching GitHub —
          # which a corporate network may well not allow. The chart names
          # exactly one image, through appVersion, so the two cannot disagree.
          cp go.list charts/devops-tools/go.list
          helm package charts/devops-tools
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            helm registry login registry-1.docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          helm push "devops-tools-${{ steps.v.outputs.chart }}.tgz" "$CHART_REGISTRY"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.v.outputs.app }}
          CHART: ${{ steps.v.outputs.chart }}
          REPO: ${{ github.repository }}
        run: |
          # Quoted heredoc: the code fences below would otherwise be read as
          # command substitution. Values go in afterwards.
          cat > install.md <<'INSTALL'

          ## Install

          Start from an example values file — one per way of signing in:

          ```bash
          # accounts kept by the portal itself, with nothing else to install
          curl -O https://raw.githubusercontent.com/__REPO__/__TAG__/examples/values-local.yaml
          # Active Directory or OpenLDAP
          curl -O https://raw.githubusercontent.com/__REPO__/__TAG__/examples/values-ldap.yaml
          # Keycloak, and anything else speaking OpenID Connect
          curl -O https://raw.githubusercontent.com/__REPO__/__TAG__/examples/values-oidc.yaml
          ```

          Fill in the one you took, then install with it:

          ```bash
          helm install devops-tools __REGISTRY__/devops-tools --version __CHART__ \
            --namespace devops-tools --create-namespace \
            -f values-ldap.yaml
          ```

          The administrator password is the one thing an install has to decide:
          nothing here ships a default, so with none set the service stops at
          startup rather than coming up as a portal anybody could walk into.
          INSTALL

          sed -i "s|__CHART__|$CHART|g; s|__REGISTRY__|$CHART_REGISTRY|g" install.md
          sed -i "s|__REPO__|$REPO|g; s|__TAG__|$GITHUB_REF_NAME|g" install.md

          # The changelog entry for this version, so that the notes say what
          # changed rather than only how to install it. Written by hand in
          # CHANGELOG.md: a list of commit subjects is not the same thing.
          {
            printf 'Image: `%s:%s`\nChart version: `%s`\n\n## What changed\n\n' "$IMAGE" "$APP" "$CHART"
            awk -v want="## $APP" '$0 == want {found=1; next} /^## / {found=0} found' CHANGELOG.md
            cat install.md
          } > notes.md

          if ! grep -q '^- ' notes.md; then
            echo "CHANGELOG.md has no section for $APP; add one before tagging."
            exit 1
          fi
          cat notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md go.list

      # The release group on Telegram, the same one the GitLab pipelines post
      # to. Nothing here is KCSD-specific except the two secrets: without them
      # the step says so and ends, so a fork releases exactly as before.
      #
      # HTML rather than Markdown, which is what the GitLab templates use: a
      # changelog carries backticks, underscores and brackets, and Markdown
      # mode rejects the whole message over one of them. HTML only cares about
      # three characters, and they are escaped below.
      - name: Tell the release group
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_GROUP_ID: ${{ secrets.TG_GROUP_ID }}
          APP: ${{ steps.v.outputs.app }}
          CHART: ${{ steps.v.outputs.chart }}
          REPO: ${{ github.repository }}
          # Who the group is told released it: the GitHub login of whoever
          # pushed the tag, unless the repository variable TG_ANNOUNCED_AS
          # names somebody else. The login is often not the name colleagues
          # know; set the variable before tagging, remove it afterwards.
          ACTOR: ${{ vars.TG_ANNOUNCED_AS || github.actor }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_GROUP_ID" ]; then
            echo "TG_BOT_TOKEN or TG_GROUP_ID is not set; no message sent."
            exit 0
          fi

          # The same section the notes were built from. Out come the markers
          # that only mean something in Markdown, escaped are the three that
          # mean something in HTML, and undone is the hard wrapping: the file
          # is wrapped for reading as a file, and a phone wraps it again, which
          # leaves every second line indented for no reason.
          changelog=$(awk -v want="## $APP" '$0 == want {found=1; next} /^## / {found=0} found' CHANGELOG.md \
            | sed -e 's/\*\*//g' -e 's/`//g' \
            | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
            | awk '/^- / { if (line != "") print line; line = $0; next }
                   /^[[:space:]]*$/ { if (line != "") print line; line = ""; next }
                   { sub(/^[[:space:]]+/, ""); line = (line == "" ? $0 : line " " $0) }
                   END { if (line != "") print line }' \
            | head -c 2500)

          # One line per argument rather than one indented string: the file's
          # own indentation would otherwise have to be stripped afterwards,
          # and that takes the changelog's indentation with it.
          text=$(printf '%s\n' \
            "🔥<b>Релиз</b>" \
            "Проект: <code>${REPO##*/}</code>" \
            "Версия: <code>${APP}</code>" \
            "Чарт: <code>${CHART}</code>" \
            "Changelog:" \
            "<code>${changelog}</code>" \
            "" \
            "Образ и чарт опубликованы!" \
            "" \
            "Релиз: https://github.com/${REPO}/releases/tag/${GITHUB_REF_NAME}" \
            "Пайплайн: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
            "Пользователь: <i>${ACTOR}</i>" \
            "" \
            "Контейнер: <a href=\"https://hub.docker.com/r/${IMAGE}/tags?name=${APP}\">${IMAGE}:${APP}</a>")

          # Built with jq rather than by hand: a changelog contains quotes and
          # newlines, and a hand-quoted JSON body is where that ends badly.
          jq -n --arg chat "$TG_GROUP_ID" --arg text "$text" \
            '{chat_id: $chat, text: $text, parse_mode: "HTML",
              disable_notification: true, disable_web_page_preview: true}' > tg.json

          # --fail-with-body so a refusal is visible: Telegram answers 400 with
          # the reason in the body, and a silent failure here means a release
          # nobody heard about.
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' -d @tg.json

      # Last, after everything is published and announced: an exception is an
      # addition to a release, not part of it, and it can be attached again to
      # an image that is already out without rebuilding anything. A failure
      # here leaves the release red, which is the point — but not unannounced.
      #
      # The documents in .vex/ name the image with a placeholder for the
      # version, because a VEX statement is about one product.
      - name: Render the VEX statements for this image
        env:
          APP: ${{ steps.v.outputs.app }}
        run: |
          mkdir -p vex
          for f in .vex/*.vex.json; do
            sed "s|@__VERSION__\"|@${APP}\"|" "$f" > "vex/$(basename "$f")"
            grep -q "@${APP}\"" "vex/$(basename "$f")" || { echo "$f has no __VERSION__ placeholder"; exit 1; }
          done
          ls vex

      - name: Attach them to the image
        uses: docker/scout-action@v1
        with:
          # quickview after attaching, so the log ends with what Scout now
          # reports for this image, exceptions applied.
          command: attestation-add,quickview
          # No prefix: that means image://, which every command accepts, and the
          # runner has no local copy — buildx pushed without loading — so it is
          # the registry's image either way.
          image: ${{ env.IMAGE }}:${{ steps.v.outputs.app }}
          file: vex/GO-2026-5932.vex.json
          predicate-type: https://openvex.dev/ns/v0.2.0
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
