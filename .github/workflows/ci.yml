name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # From go.mod. The Dockerfile names the same release separately — the
      # step below is what keeps the two from drifting.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

      # The tests and the weekly scan use the toolchain go.mod names; the image
      # is built with the one the Dockerfile names. Different releases mean the
      # scan reads one standard library and the image ships another, which is
      # how 0.25.6 went out on 1.26.8 with thirteen fixes already published.
      # An older one in the Dockerfile fails its own build; this catches the
      # newer one, which would build without complaint.
      - name: Dockerfile builds with the go.mod toolchain
        run: |
          want=$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)
          got=$(sed -n 's/^FROM golang:\([0-9.]*\) .*/\1/p' Dockerfile)
          echo "go.mod: $want  Dockerfile: $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "Set FROM golang:$want in the Dockerfile, or bump go.mod to match."
            exit 1
          fi

      # .vex/ tells scanners the image is not affected by findings that sit in
      # a module we need but in a package we never compile. That is true today
      # and has to stay true: the day the package reaches the build, the
      # statement becomes a false one published with every image.
      - name: The VEX statements still hold
        run: |
          linked=$(go list -deps ./cmd/server | grep '^golang.org/x/crypto/openpgp' || true)
          if [ -n "$linked" ]; then
            echo "golang.org/x/crypto/openpgp is compiled in again:"
            echo "$linked" | sed 's/^/  /'
            echo "Remove .vex/GO-2026-5932.vex.json, or find what brought it back."
            exit 1
          fi
          echo "golang.org/x/crypto/openpgp is not in the binary."

  web:
    name: Web interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The same line the Dockerfile builds the interface with.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # tsc first: it says which line is wrong, where a failed bundle often does
      # not.
      - run: npx tsc -b
      - run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/devops-tools
      # Rendering catches what lint does not: a template that only breaks once
      # values reach it.
      - name: Render with defaults
        run: |
          helm template t charts/devops-tools \
            --set config.auth.bootstrapAdmins.passwordLogin.password=rendered-in-ci \
            > /dev/null
      # The examples are install instructions, so a broken one is a broken README.
      - name: Render the examples
        run: |
          for f in examples/*.yaml; do
            helm template t charts/devops-tools -f "$f" \
              --set config.auth.bootstrapAdmins.passwordLogin.password=rendered-in-ci \
              > /dev/null
          done
      # Rendering with no password at all still has to work: refusing that is
      # the service's job, at startup, where it can see the environment as well
      # as the file. The chart only refuses what it can judge for itself — a
      # password too short, or both forms of one credential at once.
      - name: Refuses a password that is too short
        run: |
          if helm template t charts/devops-tools \
               --set config.auth.bootstrapAdmins.passwordLogin.password=short \
               > /dev/null 2>&1; then
            echo "a five-character password was accepted"
            exit 1
          fi
